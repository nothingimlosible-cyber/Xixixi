<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XXIXI AI - Alan Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .chat-box { height: calc(100vh - 200px); overflow-y: auto; scrollbar-width: thin; scrollbar-color: #334155 #0f172a; }
        .user-msg { background: #1e293b; border-radius: 15px 15px 0 15px; }
        .ai-msg { background: #334155; border-radius: 15px 15px 15px 0; border-left: 4px solid #38bdf8; }
        pre { background: #000; padding: 10px; border-radius: 8px; overflow-x: auto; margin-top: 10px; color: #10b981; }
        .input-area { background: #1e293b; border-top: 1px solid #334155; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-sky-400">XXIXI AI <span class="text-xs font-light text-slate-500 text-upper">Alan Edition</span></h1>
            <input type="password" id="apiKey" placeholder="Paste API Key Here" class="bg-slate-800 border border-slate-700 text-xs p-2 rounded w-48 focus:outline-none focus:border-sky-500">
        </div>

        <div id="chatWindow" class="chat-box space-y-4 mb-4 p-4">
            <div class="ai-msg p-4 max-w-[80%]">
                Halo Alan! XXIXI AI sudah siap. Masukkan API Key di atas, lalu suruh saya koding HTML atau bantu proyek affiliate kamu.
            </div>
        </div>

        <div class="input-area fixed bottom-0 left-0 right-0 p-4">
            <div class="max-w-4xl mx-auto flex gap-2">
                <textarea id="userInput" rows="1" class="flex-1 bg-slate-900 border border-slate-700 p-3 rounded-lg focus:outline-none focus:border-sky-500" placeholder="Tanya XXIXI AI..."></textarea>
                <button onclick="sendChat()" id="sendBtn" class="bg-sky-600 hover:bg-sky-500 px-6 py-2 rounded-lg font-semibold transition">Kirim</button>
            </div>
        </div>
    </div>

    <script>
        async function sendChat() {
            const key = document.getElementById('apiKey').value;
            const input = document.getElementById('userInput').value;
            const chatWindow = document.getElementById('chatWindow');
            const btn = document.getElementById('sendBtn');

            if (!key) return alert("Masukkan API Key dulu, Lan!");
            if (!input) return;

            // Tambah chat user
            chatWindow.innerHTML += `<div class="user-msg p-4 ml-auto max-w-[80%] text-right">${input}</div>`;
            document.getElementById('userInput').value = '';
            chatWindow.scrollTop = chatWindow.scrollHeight;

            btn.disabled = true;
            btn.innerText = "Mikir...";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Kamu adalah XXIXI AI, asisten koding Alan. Jawab dengan format markdown yang rapi.\n\nUser: ${input}` }] }]
                    })
                });

                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;

                // Render AI Response (Sederhana tanpa parser berat)
                const formattedText = aiText.replace(/```/g, '<pre>').replace(/<\/pre><pre>/g, '</pre>');
                chatWindow.innerHTML += `<div class="ai-msg p-4 max-w-[80%] whitespace-pre-wrap">${aiText}</div>`;
            } catch (e) {
                chatWindow.innerHTML += `<div class="text-red-500">Error: Cek API Key atau koneksi kamu.</div>`;
            }

            btn.disabled = false;
            btn.innerText = "Kirim";
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
    </script>
</body>
</html>
