<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XXIXI AI - Alan Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #ececec; }
        .chat-container { height: calc(100vh - 180px); overflow-y: auto; }
        pre { background: #111; padding: 15px; border-radius: 10px; border: 1px solid #333; overflow-x: auto; color: #10b981; font-size: 0.8rem; margin: 10px 0; }
        .ai-bubble { border-left: 3px solid #eab308; background: rgba(255,255,255,0.02); }
        .user-bubble { background: #1a1a1a; border: 1px solid #333; }
    </style>
</head>
<body class="max-w-2xl mx-auto h-screen flex flex-col">

    <header class="p-6 border-b border-zinc-900 flex justify-between items-center backdrop-blur-lg sticky top-0 z-50">
        <h1 class="text-2xl font-black text-yellow-500 italic">XXIXI AI</h1>
        <span class="text-[10px] bg-zinc-800 px-2 py-1 rounded text-zinc-400">VERCEL SECURE</span>
    </header>

    <main id="chatWindow" class="chat-container flex flex-col p-5 space-y-6 flex-1">
        <div class="ai-bubble p-4 rounded-r-2xl">
            <p class="text-sm">Halo Alan! Sistem **XXIXI AI** aktif via Vercel. Kirim teks, kodingan, atau tanya apa saja.</p>
        </div>
    </main>

    <footer class="p-4 bg-zinc-950 border-t border-zinc-900 rounded-t-3xl">
        <div class="flex flex-col gap-3">
            <textarea id="userInput" rows="2" class="w-full bg-black p-4 rounded-2xl border border-zinc-800 focus:border-yellow-500 outline-none transition-all text-sm resize-none" placeholder="Tanya XXIXI..."></textarea>
            <button id="sendBtn" onclick="sendChat()" class="w-full bg-yellow-500 text-black font-black py-3 rounded-2xl hover:bg-yellow-400 transition">KIRIM PESAN</button>
        </div>
    </footer>

    <script>
        async function sendChat() {
            const input = document.getElementById('userInput');
            const chatWindow = document.getElementById('chatWindow');
            const btn = document.getElementById('sendBtn');
            const text = input.value.trim();

            if (!text) return;

            // User Chat
            chatWindow.innerHTML += `<div class="user-bubble p-4 rounded-2xl self-end max-w-[90%] text-sm">${text}</div>`;
            input.value = '';
            btn.disabled = true;
            btn.innerText = "THINKING...";

            try {
                // TEMBAK KE API INTERNAL VERCEL
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: text })
                });

                const data = await response.json();
                const aiText = data.choices[0].message.content;

                chatWindow.innerHTML += `
                    <div class="ai-bubble p-4 rounded-r-2xl text-sm leading-relaxed">
                        ${aiText.replace(/\n/g, '<br>').replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')}
                    </div>`;
            } catch (e) {
                chatWindow.innerHTML += `<div class="text-red-500 text-xs italic text-center">Gagal terhubung ke API Vercel.</div>`;
            } finally {
                btn.disabled = false;
                btn.innerText = "KIRIM PESAN";
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }
        }
    </script>
</body>
</html>
